name: Dependency Lockfile Generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency remediation
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
